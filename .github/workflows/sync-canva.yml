name: Sync artwork from Canva

# Run this manually after completing the Azure Key Vault setup in README.md.
# To automate it, add a schedule trigger after verifying one successful manual run.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the current Canva refresh token
        id: canva-token
        shell: bash
        run: |
          bundle="$(az keyvault secret show --vault-name "${{ vars.CANVA_KEY_VAULT_NAME }}" --name canva-oauth-token --query value --output tsv)"
          token="$(BUNDLE="$bundle" node -e "process.stdout.write(JSON.parse(process.env.BUNDLE).refresh_token || '')")"
          if [ -z "$token" ]; then
            echo "The Key Vault token bundle does not contain a refresh token."
            exit 1
          fi
          echo "::add-mask::$bundle"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Export changed Canva designs
        run: npm run sync:canva
        env:
          CANVA_CLIENT_ID: ${{ vars.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ steps.canva-token.outputs.token }}
          CANVA_REFRESH_TOKEN_OUT: ${{ runner.temp }}/canva-refresh-token
          CANVA_FOLDER_ID: ${{ vars.CANVA_FOLDER_ID }}

      - name: Store the rotated Canva token bundle
        if: always()
        shell: bash
        run: |
          token_file="${{ runner.temp }}/canva-refresh-token"
          if [ ! -s "$token_file" ]; then
            echo "No rotated refresh token was produced."
            exit 0
          fi
          refresh_token="$(cat "$token_file")"
          bundle="$(REFRESH_TOKEN="$refresh_token" node -e "process.stdout.write(JSON.stringify({ access_token: '', refresh_token: process.env.REFRESH_TOKEN, expires_at: 0 }))")"
          az keyvault secret set \
            --vault-name "${{ vars.CANVA_KEY_VAULT_NAME }}" \
            --name canva-oauth-token \
            --value "$bundle" \
            --output none

      - name: Commit synchronized artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/canva-artworks.json
          if [ -d public/art/canva ]; then
            git add -A public/art/canva
          fi
          if git diff --cached --quiet; then
            echo "No artwork changes to commit."
          else
            git commit -m "Sync artwork from Canva"
            git push
          fi
